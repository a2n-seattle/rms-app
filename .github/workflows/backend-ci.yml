# Workflow to run backend tests on push
name: Backend CI

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the alpha branch
  # (alpha is this repo's active-development merge target -- see the
  # "Branching and environment promotion" section in root CLAUDE.md)
  pull_request:
    branches: [ alpha ]

jobs:
  run-unit-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: use node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: install, build and unit test
        run: |
          npm install
          npm run build
          npm run test:unit

      - name: typecheck gen2
        run: |
          npx tsc --noEmit -p amplify/tsconfig.json

      - name: code coverage
        uses: artiomtr/jest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          threshold: 80
          skip-step: all