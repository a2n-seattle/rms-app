# Workflow to run frontend (web/) tests on push
name: Frontend CI

on:
  pull_request:
    branches: [ alpha ]
    paths: [ 'web/**' ]

  # Allows re-running the full suite (including e2e, served locally via
  # `next start` against the real alpha backend -- see the e2e steps
  # below) on demand, without needing a throwaway PR to trigger it.
  workflow_dispatch:

# e2e exercises the real deployed alpha backend against a single shared fixture item
# (RMS_TEST_ITEM_ID) -- two runs' e2e steps executing at the same time race on that item's
# borrow/reservation state. Queue runs instead of letting them overlap; a newer run for the
# same PR/ref supersedes an in-flight older one rather than piling up.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # No `environment: AmplifyCD` here -- GitHub Actions evaluates a
    # protected environment's branch policy against the synthetic PR
    # merge ref (refs/pull/<N>/merge), which can never match a real
    # branch pattern, so environment-scoped secrets are structurally
    # unreachable from pull_request-triggered jobs. This job never
    # deploys anything (ampx generate outputs is read-only; the e2e test
    # only reads/exercises the already-deployed alpha environment), so it
    # uses plain repository secrets instead.

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: use node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: install root deps (for ampx)
        # npm install (not ci) to match backend-ci.yml/backend-cd.yml's
        # existing convention for the root package-lock.json.
        run: npm install

      - name: generate amplify outputs
        run: npx ampx generate outputs --app-id "$GEN2_AMPLIFY_APP_ID" --branch alpha --out-dir web
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GEN2_AMPLIFY_APP_ID: ${{ secrets.GEN2_AMPLIFY_APP_ID }}

      - name: install web/ deps
        working-directory: web
        run: npm ci

      - name: lint
        working-directory: web
        run: npm run lint

      - name: build
        working-directory: web
        run: npm run build

      - name: unit test
        working-directory: web
        run: npm run test

      - name: install playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: start web/ against real alpha backend
        # e2e must exercise *this PR's* frontend code, not the
        # already-deployed alpha site -- RMS_WEB_BASE_URL previously
        # pointed Playwright at the live site, so a PR could pass even
        # when its own new pages/routes were broken (only caught once
        # merged and manually re-verified). `next start` here serves this
        # PR's own build locally; amplify_outputs.json (generated above)
        # still points at the real deployed Cognito/API Gateway/DynamoDB
        # on alpha, so the backend under test is still real, only the
        # frontend serving is local.
        working-directory: web
        run: |
          AMPLIFY_APP_ORIGIN=http://localhost:3000 npx next start &
          echo $! > /tmp/next-start.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && exit 0
            sleep 2
          done
          echo "web/ server did not become ready in time" >&2
          exit 1

      - name: e2e test
        working-directory: web
        run: npm run test:e2e
        env:
          RMS_TEST_USER_EMAIL: ${{ secrets.RMS_TEST_USER_EMAIL }}
          RMS_TEST_USER_PASSWORD: ${{ secrets.RMS_TEST_USER_PASSWORD }}
          RMS_TEST_ITEM_ID: ${{ secrets.RMS_TEST_ITEM_ID }}
          RMS_WEB_BASE_URL: http://localhost:3000

      - name: stop web/ server
        if: always()
        run: kill "$(cat /tmp/next-start.pid)" 2>/dev/null || true
