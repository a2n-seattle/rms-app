# Manually promote code from one environment branch to the next, per this
# repo's alpha -> beta -> master branching model (see root CLAUDE.md's
# "Branching and environment promotion" section). Deliberately a manual
# workflow_dispatch, not an automatic push trigger -- promotion is a
# deliberate "this is verified, ship it further" decision, not something
# that should fire on every merge to alpha.
#
# beta and master are CANONICAL branches only -- nothing deploys directly
# from them. This job fast-forwards the canonical branch, then fans out to
# every real city branch registered at that stage in
# amplify/config/cities.json (e.g. beta -> seattle), which is what actually
# triggers a deploy (city-cd.yml, pushed to on any registered city branch).
# Fanning out to a city whose AWS resources (tables/Cognito/Amplify branch)
# haven't been provisioned yet is safe: city-cd.yml's deploy step will just
# fail against nonexistent infra, same as pushing to any other unprovisioned
# environment -- see the provisioning runbook in CLAUDE.md before relying on
# a real promotion.
name: Promote environment branch

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to promote into"
        required: true
        type: choice
        options:
          - beta
          - master

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine source branch for this target
        id: source
        run: |
          case "${{ github.event.inputs.target }}" in
            beta) echo "branch=alpha" >> "$GITHUB_OUTPUT" ;;
            master) echo "branch=beta" >> "$GITHUB_OUTPUT" ;;
          esac
          # master promotes from beta, keeping the full alpha -> beta ->
          # master chain intact per root CLAUDE.md.

      - name: Fast-forward canonical target branch
        env:
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          TARGET_BRANCH: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_BRANCH" "$TARGET_BRANCH"

          if ! git merge-base --is-ancestor "origin/$TARGET_BRANCH" "origin/$SOURCE_BRANCH"; then
            echo "::error::origin/$TARGET_BRANCH has commits not present on origin/$SOURCE_BRANCH -- this isn't a fast-forward. Resolve manually (merge or rebase) before promoting."
            exit 1
          fi

          git push origin "origin/$SOURCE_BRANCH:refs/heads/$TARGET_BRANCH"
          echo "Promoted $SOURCE_BRANCH -> $TARGET_BRANCH ($(git rev-parse --short origin/$SOURCE_BRANCH))"

      - name: Fan out to cities registered at this stage
        env:
          TARGET_BRANCH: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          cities=$(jq -r --arg stage "$TARGET_BRANCH" '.cities[] | select(.stage == $stage) | .branch' amplify/config/cities.json)

          if [ -z "$cities" ]; then
            echo "No cities registered at stage '$TARGET_BRANCH' in amplify/config/cities.json -- nothing to fan out to."
            exit 0
          fi

          git fetch origin "$TARGET_BRANCH"
          while IFS= read -r city_branch; do
            git push origin "origin/$TARGET_BRANCH:refs/heads/$city_branch"
            echo "Fanned out $TARGET_BRANCH -> $city_branch ($(git rev-parse --short "origin/$TARGET_BRANCH"))"
          done <<< "$cities"
