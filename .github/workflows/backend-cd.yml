# Workflow to push to Amplify on commit
name: Backend CD

# Controls when the action will run.
on:
  # Triggers the workflow on push events but only for the alpha branch --
  # alpha is this repo's active-development merge target and has the only
  # provisioned backend environment today (see root CLAUDE.md's
  # "Branching and environment promotion" section). beta/production get
  # their own deploy workflows once those environments are provisioned.
  #
  # Includes ts-code/** alongside amplify/** -- this job's own "build:gen2"
  # step (below) compiles ts-code and fans it into every Lambda's deployed
  # build/ directory, so a ts-code-only change (the common case: touching
  # src/api/*.ts, src/db/*.ts, src/handlers/**/*.ts) changes what actually
  # runs in production just as much as an amplify/** change does. Limiting
  # this trigger to amplify/** alone let backend logic changes merge to
  # alpha with green CI yet never actually deploy (confirmed directly: GH-384's
  # Scan-avoidance fix sat live-but-undeployed for over 24 hours, and the
  # real DynamoDB throughput pressure it was meant to fix never went away,
  # since the old Lambda code was still the one actually running).
  push:
    branches: [ alpha ]
    paths: [ 'amplify/**', 'ts-code/**' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency: AmplifyCD

jobs:
  amplify-deploy:
    runs-on: ubuntu-latest
    environment: AmplifyCD

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: use node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: install, build and unit test
        run: |
          npm install
          npm run build
          npm run build:gen2
          npm run test:unit

      - name: deploy
        run: |
          npx ampx pipeline-deploy --branch alpha --app-id "$GEN2_AMPLIFY_APP_ID"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GEN2_AMPLIFY_APP_ID: ${{ secrets.GEN2_AMPLIFY_APP_ID }}

      - name: integration test
        run: |
          npm run test:integ

      - name: Report Status
        uses: ravsamhq/notify-slack-action@v2
        if: always()
        with:
          status: ${{ job.status }}
          notify_when: 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ACTION_MONITORING_SLACK }}