version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            # amplify_outputs.json is already written into web/ by the
            # backend phase above (which runs before this one, from repo
            # root where ampx is actually installed -- web/ has no ampx
            # dependency of its own, so calling it again here would fail).
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    backend:
      phases:
        build:
          commands:
            # The backend phase runs from appRoot (web/), same as the
            # frontend phase -- confirmed empirically against two real
            # failed builds: neither omitting buildPath nor setting
            # `buildPath: /` changed the actual working directory (the
            # installed package set was always web/'s, never root's).
            # `buildPath` appears to only affect the frontend section in
            # practice, despite AWS's docs showing it under an app-level
            # example. So: cd to repo root explicitly, install there
            # (where ampx/@aws-amplify/backend-cli actually lives), and
            # generate outputs with --out-dir web -- relative to the new
            # (repo root) cwd, pointing back at the same web/ this phase
            # started in.
            - cd .. && npm ci && npx ampx generate outputs --app-id $AWS_APP_ID --branch $AWS_BRANCH --out-dir web
            # web/ has no CDK backend of its own; ts-code's Gen 2 backend is
            # deployed independently by .github/workflows/backend-cd.yml,
            # triggered on push to this same "alpha" Git branch (which is
            # also the CDK/ampx environment name -- see root CLAUDE.md's
            # "Branching and environment promotion" section). Substituting
            # `ampx generate outputs` for the default `ampx pipeline-deploy`
            # is the documented way to skip Amplify Hosting's own backend
            # deploy while still fetching config for the frontend build
            # (there's no dedicated Gen 2 "skip backend build" flag --
            # that's Gen-1-only).
